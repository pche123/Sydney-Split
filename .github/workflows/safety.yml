name: Fetch safety data
on:
  workflow_dispatch:
    inputs:
      cities: { description: "Cities (space separated, empty = all)", required: false, default: "" }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install geopandas pyogrio rasterio requests pandas numpy shapely
      - run: python pipeline/get_safety.py ${{ github.event.inputs.cities }}
      - name: Publish results to the safety-data branch
        if: always()
        run: |
          cd results/safety && git init -q && git checkout -q -b safety-data && git add -A
          git -c user.name="Prasad Cheema" -c user.email="pche123@users.noreply.github.com" commit -qm "Safety data (run ${{ github.run_id }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" safety-data
