name: Fetch Korea over time
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install geopandas pyarrow requests
      - run: python pipeline/get_korea_mois.py
      - name: Publish to the korea-data branch
        if: always()
        run: |
          cd results/korea_time && git init -q && git checkout -q -b korea-data && git add -A
          git -c user.name="Prasad Cheema" -c user.email="pche123@users.noreply.github.com" commit -qm "Korea over time (run ${{ github.run_id }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" korea-data
